<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
:root {
  --bg: #f4f2ee; --col: #e9e6df; --card: #ffffff; --text: #1f1d1a; --muted: #6f6a61;
  --line: #d6d1c7; --accent: #7a4fd6; --accent-soft: #ece4fb; --danger: #c0392b;
  --drop: #7a4fd6; --shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04);
  --p-high: #d9534f; --p-med: #e0a100; --p-low: #3c9d6b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a; --col: #211f25; --card: #2b2830; --text: #ece9f1; --muted: #a29ca9;
    --line: #3a3640; --accent: #a88af0; --accent-soft: #332a47; --danger: #e8685c;
    --drop: #a88af0; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
header .grow { flex: 1; }
#search { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); min-width: 200px; }
label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); user-select: none; }
#status { color: var(--muted); font-size: 12px; }
#status.err { color: var(--danger); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
#banner { display: none; padding: 8px 16px; background: var(--accent-soft); font-size: 13px; }

#board { flex: 1; display: flex; gap: 12px; padding: 16px; overflow-x: auto; align-items: flex-start; }
.column { background: var(--col); border-radius: 10px; width: 290px; min-width: 290px; display: flex; flex-direction: column; max-height: 100%; }
.column.col-drag { opacity: .4; }
.col-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 12px; cursor: grab; }
.col-head .name { font-weight: 600; flex: 1; border: 0; background: transparent; padding: 2px 4px; border-radius: 4px; min-width: 0; }
.col-head .name:focus { background: var(--card); outline: 1px solid var(--accent); }
.col-head .count { color: var(--muted); font-size: 12px; }
.col-head .icon { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 4px; }
.col-head .icon:hover { background: var(--line); color: var(--text); }
.col-head .done-flag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.cards { padding: 4px 8px 8px; overflow-y: auto; min-height: 40px; display: flex; flex-direction: column; gap: 8px; }
.drop-line { height: 3px; background: var(--drop); border-radius: 2px; margin: -2px 0; }

.card { background: var(--card); border-radius: 8px; padding: 9px 10px; box-shadow: var(--shadow); cursor: grab; border-left: 3px solid transparent; }
.card:hover { outline: 1px solid var(--line); }
.group { display: flex; flex-direction: column; gap: 6px; }
.group.dragging { opacity: .35; }
.children { display: flex; flex-direction: column; gap: 6px; margin-left: 12px; padding-left: 8px; border-left: 2px solid var(--line); }
.children:empty, .group.collapsed > .children { display: none; }
.card .row { display: flex; align-items: flex-start; gap: 4px; }
.card .row .title { flex: 1; min-width: 0; }
.twisty { border: 0; background: transparent; color: var(--muted); width: 22px; height: 20px; padding: 0; margin-left: -4px; border-radius: 4px; flex: none; display: grid; place-items: center; }
.twisty svg { transition: transform .12s; }
.twisty.shut svg { transform: rotate(-90deg); }
.twisty:hover { background: var(--line); color: var(--text); }
.hidden-count { font-size: 11px; color: var(--muted); background: var(--col); border-radius: 8px; padding: 0 6px; align-self: center; }
.card.p-high { border-left-color: var(--p-high); }
.card.p-med { border-left-color: var(--p-med); }
.card.p-low { border-left-color: var(--p-low); }
.card.is-done .title { text-decoration: line-through; color: var(--muted); }
.card .parent { font-size: 11px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .title { word-wrap: break-word; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
.tag { background: var(--accent-soft); color: var(--text); border-radius: 4px; padding: 0 6px; font-size: 11px; }
.progress { display: flex; align-items: center; gap: 6px; }
.progress .bar { width: 50px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }

.add-card { margin: 0 8px 8px; }
.add-card button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 6px; }
.add-card button:hover { background: var(--line); color: var(--text); }
.add-card textarea { width: 100%; resize: none; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; background: var(--card); }
.add-col { min-width: 220px; }

/* detail panel */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; justify-content: center; align-items: flex-start; padding: 6vh 16px; overflow-y: auto; }
#overlay.open { display: flex; }
#panel { background: var(--bg); border-radius: 12px; width: 620px; max-width: 100%; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#panel .crumb { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
#panel .crumb a { color: var(--accent); cursor: pointer; }
#d-title { width: 100%; font-size: 18px; font-weight: 600; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 6px; }
#d-title:hover, #d-title:focus { border-color: var(--line); background: var(--card); outline: none; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.fields label, .block > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.fields select, .fields input, #d-notes { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
#d-notes { min-height: 90px; resize: vertical; }
.block { margin-top: 14px; }
.sub-list { list-style: none; margin: 4px 0 6px; padding: 0; }
.sub-list li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; }
.sub-list li:hover { background: var(--card); }
.sub-list li .t { flex: 1; cursor: pointer; }
.sub-list li.done .t { text-decoration: line-through; color: var(--muted); }
.sub-list li .c { font-size: 11px; color: var(--muted); }
.sub-list li .n { font-size: 11px; color: var(--muted); }
#d-newsub { width: 100%; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; }
.agent { font-size: 11px; border-radius: 4px; padding: 0 6px; background: var(--accent-soft); color: var(--accent); }
.agent.working { background: var(--accent); color: #fff; }
#d-agent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
#d-agent code { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; cursor: copy; }
.panel-foot { display: flex; justify-content: space-between; margin-top: 18px; color: var(--muted); font-size: 12px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Task Board</h1>
  <input id="search" type="search" placeholder="Filter tasks…">
  <label class="toggle"><input type="checkbox" id="show-subs" checked> Show subtasks on board</label>
  <span class="grow"></span>
  <span id="status"></span>
</header>
<div id="banner">Not running through <code>server.py</code>: tasks are saved in this browser only. Run <code>python3 tools/task_board/server.py</code> to save them to <code>tasks.json</code>.</div>
<main id="board"></main>

<div id="overlay">
  <div id="panel">
    <div class="crumb" id="d-crumb"></div>
    <input id="d-title">
    <div class="fields">
      <div><label for="d-col">Column</label><select id="d-col"></select></div>
      <div><label for="d-prio">Priority</label>
        <select id="d-prio"><option value="">None</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select></div>
      <div style="grid-column: 1 / -1"><label for="d-tags">Tags (comma separated)</label><input id="d-tags"></div>
    </div>
    <div class="block"><label for="d-notes">Notes</label><textarea id="d-notes"></textarea></div>
    <div class="block">
      <label>Subtasks <span id="d-subcount"></span></label>
      <ul class="sub-list" id="d-subs"></ul>
      <input id="d-newsub" placeholder="+ Add a subtask and press Enter">
    </div>
    <div class="block"><label>Claude</label><div id="d-agent"></div></div>
    <div class="panel-foot">
      <span id="d-dates"></span>
      <span><button class="btn danger" id="d-delete">Delete</button> <button class="btn primary" id="d-close">Close</button></span>
    </div>
  </div>
</div>

<script>
"use strict";
const LS_KEY = "mage-task-board";
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();

let state = null;          // { version, columns:[{id,name,done}], tasks:[{id,title,notes,priority,tags,column,parent,order,created,updated}] }
let useServer = true;
let openId = null;         // task shown in the detail panel
let drag = null;           // { kind:'card'|'col', id }

function defaultState() {
  const cols = [["To Do", false], ["In Progress", false], ["Review", false], ["Done", true]]
    .map(([name, done]) => ({ id: uid(), name, done }));
  return { version: 1, columns: cols, tasks: [] };
}

// ---------------------------------------------------------------- persistence
async function load() {
  try {
    const r = await fetch("/api/tasks", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    state = (await r.json()) || defaultState();
  } catch (e) {
    useServer = false;
    $("#banner").style.display = "block";
    try { state = JSON.parse(localStorage.getItem(LS_KEY)); } catch (_) { state = null; }
    state = state || defaultState();
  }
}

let saveTimer = null;
function save() {
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
}
async function flush(keepalive = false) {
  clearTimeout(saveTimer);
  saveTimer = null;
  const body = JSON.stringify(state);
  try {
    if (useServer) {
      const r = await fetch("/api/tasks", { method: "PUT", headers: { "Content-Type": "application/json" }, body, keepalive });
      if (!r.ok) throw new Error("server said " + r.status);
    } else {
      localStorage.setItem(LS_KEY, body);
    }
    setStatus("Saved");
  } catch (e) {
    setStatus("Save failed: " + e.message, true);
  }
}
function setStatus(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }
// keepalive lets the pending save finish after the page is gone.
window.addEventListener("pagehide", () => { if (saveTimer) flush(true); });

// ---------------------------------------------------------------- model helpers
const task = (id) => state.tasks.find((t) => t.id === id);
const column = (id) => state.columns.find((c) => c.id === id);
const children = (id) => state.tasks.filter((t) => t.parent === id).sort((a, b) => a.order - b.order);
const isDone = (t) => !!(column(t.column) || {}).done;
const firstOpenCol = () => (state.columns.find((c) => !c.done) || state.columns[0]).id;
const doneCol = () => (state.columns.find((c) => c.done) || state.columns[state.columns.length - 1]).id;
function descendants(id) { return children(id).flatMap((c) => [c, ...descendants(c.id)]); }
function nextOrder(colId) {
  const inCol = state.tasks.filter((t) => t.column === colId);
  return inCol.length ? Math.max(...inCol.map((t) => t.order)) + 1 : 0;
}

function addTask(title, colId, parent = null) {
  const t = { id: uid(), title: title.trim(), notes: "", priority: "", tags: [], column: colId,
              parent, order: nextOrder(colId), created: now(), updated: now() };
  state.tasks.push(t);
  save();
  return t;
}
function touch(t) { t.updated = now(); save(); }

// The subtasks drawn nested under `t` in column `colId` (same-column chain only).
function nestedIn(t, colId) { return children(t.id).filter((c) => c.column === colId).flatMap((c) => [c, ...nestedIn(c, colId)]); }

// Put task `id` into column `colId`, just before sibling `beforeId` (null = at the end).
// `carry` brings along the subtasks nested under it in its old column.
function moveTask(id, colId, beforeId, carry = true) {
  const t = task(id);
  const carried = carry && t.column !== colId ? nestedIn(t, t.column) : [];
  const moving = new Set([t.id, ...carried.map((x) => x.id)]);
  const list = state.tasks.filter((x) => x.column === colId && !moving.has(x.id)).sort((a, b) => a.order - b.order);
  let idx = beforeId ? list.findIndex((x) => x.id === beforeId) : -1;
  if (idx < 0) idx = list.length;
  list.splice(idx, 0, t, ...carried);
  list.forEach((x, i) => (x.order = i));
  for (const x of moving) task(x).column = colId;
  touch(t);
}

// Collapsed groups are a per-browser view preference, so they stay out of tasks.json.
const collapsed = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY + ":collapsed") || "[]").forEach((id) => collapsed.add(id)); } catch (_) {}
function toggleCollapsed(id) {
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  try { localStorage.setItem(LS_KEY + ":collapsed", JSON.stringify([...collapsed])); } catch (_) {}
  render();
}

function deleteTask(id) {
  const gone = new Set([id, ...descendants(id).map((t) => t.id)]);
  state.tasks = state.tasks.filter((t) => !gone.has(t.id));
  save();
}

function parseTags(s) { return s.split(",").map((x) => x.trim()).filter(Boolean); }

// ---------------------------------------------------------------- board rendering
function matches(t, q) {
  if (!q) return true;
  const hay = [t.title, t.notes, ...(t.tags || [])].join(" ").toLowerCase();
  return hay.includes(q);
}

function render() {
  const board = $("#board");
  const q = $("#search").value.trim().toLowerCase();
  const showSubs = $("#show-subs").checked;
  board.innerHTML = "";

  for (const col of state.columns) {
    const el = document.createElement("section");
    el.className = "column";
    el.dataset.col = col.id;

    const cards = state.tasks
      .filter((t) => t.column === col.id && (showSubs || !t.parent) && matches(t, q))
      .sort((a, b) => a.order - b.order);
    const shown = new Set(cards.map((t) => t.id));
    const kidsOf = (id) => cards.filter((t) => t.parent === id);

    const head = document.createElement("div");
    head.className = "col-head";
    head.draggable = true;
    head.innerHTML = `<input class="name" value="${esc(col.name)}" title="Rename column">
      ${col.done ? '<span class="done-flag" title="Tasks here count as done">done</span>' : ""}
      <span class="count">${cards.length}</span>
      <button class="icon" data-act="done" title="Toggle: tasks in this column count as done">✓</button>
      <button class="icon" data-act="del" title="Delete column (only when empty)">✕</button>`;
    const name = head.querySelector(".name");
    name.addEventListener("change", () => { col.name = name.value.trim() || col.name; save(); render(); });
    name.addEventListener("keydown", (e) => { if (e.key === "Enter") name.blur(); });
    name.addEventListener("mousedown", (e) => e.stopPropagation());
    head.querySelector('[data-act="done"]').onclick = () => { col.done = !col.done; save(); render(); };
    head.querySelector('[data-act="del"]').onclick = () => {
      if (state.tasks.some((t) => t.column === col.id)) { setStatus(`"${col.name}" still has tasks — move them first`, true); return; }
      if (state.columns.length <= 1) return;
      state.columns = state.columns.filter((c) => c !== col); save(); render();
    };
    head.addEventListener("dragstart", (e) => {
      if (e.target !== head) return;
      drag = { kind: "col", id: col.id }; el.classList.add("col-drag");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", col.id);
    });
    head.addEventListener("dragend", () => { drag = null; render(); });
    el.appendChild(head);

    const list = document.createElement("div");
    list.className = "cards";
    // A subtask nests under its parent when the parent is shown in this column too.
    for (const t of cards) if (!shown.has(t.parent)) list.appendChild(groupEl(t, kidsOf, true));
    el.appendChild(list);

    el.addEventListener("dragover", (e) => onDragOver(e, el, list));
    el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) clearDropLine(); });
    el.addEventListener("drop", (e) => onDrop(e, col));

    el.appendChild(addCardEl(col));
    board.appendChild(el);
  }

  const addCol = document.createElement("div");
  addCol.className = "add-col";
  addCol.innerHTML = `<button class="btn">+ Add column</button>`;
  addCol.firstChild.onclick = () => {
    const doneIdx = state.columns.findIndex((c) => c.done);
    const c = { id: uid(), name: "New column", done: false };
    state.columns.splice(doneIdx < 0 ? state.columns.length : doneIdx, 0, c);
    save(); render();
    const inp = document.querySelector(`[data-col="${c.id}"] .name`); inp.focus(); inp.select();
  };
  board.appendChild(addCol);
}

function groupEl(t, kidsOf, top) {
  const g = document.createElement("div");
  g.className = "group" + (collapsed.has(t.id) ? " collapsed" : "");
  g.dataset.id = t.id;
  const kids = kidsOf(t.id);
  g.appendChild(cardEl(t, top, kids.length));
  const box = document.createElement("div");
  box.className = "children";
  for (const k of kids) box.appendChild(groupEl(k, kidsOf, false));
  g.appendChild(box);
  return g;
}

function cardEl(t, top, nestedCount) {
  const el = document.createElement("div");
  el.className = "card" + (t.priority ? " p-" + t.priority : "") + (isDone(t) ? " is-done" : "");
  el.draggable = true;
  el.dataset.id = t.id;
  const kids = descendants(t.id);
  const doneKids = kids.filter(isDone).length;
  const parent = top && t.parent && task(t.parent);
  const shut = collapsed.has(t.id);
  el.innerHTML = `
    ${parent ? `<div class="parent">↳ ${esc(parent.title)}</div>` : ""}
    <div class="row">
      ${nestedCount ? `<button class="twisty${shut ? " shut" : ""}" title="${shut ? "Expand" : "Collapse"} subtasks"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}
      <div class="title">${esc(t.title)}</div>
      ${nestedCount && shut ? `<span class="hidden-count" title="Hidden subtasks">+${nestedCount}</span>` : ""}
    </div>
    ${(kids.length || t.tags.length || t.notes || t.agent) ? `<div class="meta">
      ${kids.length ? `<span class="progress" title="${doneKids} of ${kids.length} subtasks done"><span class="bar"><i style="width:${(100 * doneKids / kids.length).toFixed(0)}%"></i></span>${doneKids}/${kids.length}</span>` : ""}
      ${t.notes ? `<span title="Has notes">≡</span>` : ""}
      ${t.agent ? `<span class="agent ${t.agent.state === "working" ? "working" : ""}" title="Claude session ${t.agent.id}">Claude: ${esc(agentLabel(t.agent))}</span>` : ""}
      ${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}
    </div>` : ""}`;
  el.addEventListener("click", () => openDetail(t.id));
  const tw = el.querySelector(".twisty");
  if (tw) tw.addEventListener("click", (e) => { e.stopPropagation(); toggleCollapsed(t.id); });
  el.addEventListener("dragstart", (e) => {
    e.stopPropagation();
    drag = { kind: "card", id: t.id };
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id);
    requestAnimationFrame(() => el.parentElement.classList.add("dragging"));
  });
  el.addEventListener("dragend", () => { drag = null; clearDropLine(); el.parentElement.classList.remove("dragging"); render(); });
  return el;
}

function addCardEl(col) {
  const wrap = document.createElement("div");
  wrap.className = "add-card";
  const btn = document.createElement("button");
  btn.textContent = "+ Add task";
  btn.onclick = () => {
    const ta = document.createElement("textarea");
    ta.rows = 2; ta.placeholder = "Task title — Enter to add, Esc to stop";
    wrap.replaceChildren(ta); ta.focus();
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (ta.value.trim()) { addTask(ta.value, col.id); render(); document.querySelector(`[data-col="${col.id}"] .add-card button`).click(); }
      } else if (e.key === "Escape") render();
    });
    ta.addEventListener("blur", () => { if (!ta.value.trim()) render(); });
  };
  wrap.appendChild(btn);
  return wrap;
}

// ---------------------------------------------------------------- drag & drop
let dropLine = null;
function clearDropLine() { if (dropLine) { dropLine.remove(); dropLine = null; } }

function onDragOver(e, colEl, list) {
  if (!drag) return;
  e.preventDefault();
  if (drag.kind === "col") return;
  // A card drops among its siblings: inside its parent's group if the parent is in this column.
  const t = task(drag.id);
  const pg = t.parent && list.querySelector(`.group[data-id="${t.parent}"]`);
  const box = pg ? pg.querySelector(":scope > .children") : list;
  if (pg) pg.classList.remove("collapsed");
  const before = groupAfterPointer(box, e.clientY);
  if (!dropLine) { dropLine = document.createElement("div"); dropLine.className = "drop-line"; }
  if (before) box.insertBefore(dropLine, before); else box.appendChild(dropLine);
}

function groupAfterPointer(box, y) {
  for (const g of box.querySelectorAll(":scope > .group:not(.dragging)")) {
    const r = g.firstElementChild.getBoundingClientRect();
    if (y < r.top + r.height / 2) return g;
  }
  return null;
}

function onDrop(e, col) {
  e.preventDefault();
  if (!drag) return;
  if (drag.kind === "col") {
    const from = state.columns.findIndex((c) => c.id === drag.id);
    const to = state.columns.indexOf(col);
    if (from >= 0 && from !== to) { const [c] = state.columns.splice(from, 1); state.columns.splice(to, 0, c); save(); }
  } else {
    let next = dropLine && dropLine.nextElementSibling;
    while (next && (!next.classList.contains("group") || next.classList.contains("dragging"))) next = next.nextElementSibling;
    moveTask(drag.id, col.id, next ? next.dataset.id : null);
  }
  drag = null; clearDropLine(); render();
}

// ---------------------------------------------------------------- detail panel
function openDetail(id) {
  openId = id;
  $("#overlay").classList.add("open");
  renderDetail();
  $("#d-title").focus();
}
function closeDetail() { openId = null; $("#overlay").classList.remove("open"); render(); }

function renderDetail() {
  const t = task(openId);
  if (!t) { closeDetail(); return; }
  const chain = [];
  for (let p = t.parent && task(t.parent); p; p = p.parent && task(p.parent)) chain.unshift(p);
  $("#d-crumb").innerHTML = chain.length
    ? "Subtask of " + chain.map((p) => `<a data-id="${p.id}">${esc(p.title)}</a>`).join(" › ")
    : "Task";
  $("#d-crumb").querySelectorAll("a").forEach((a) => (a.onclick = () => { openId = a.dataset.id; renderDetail(); }));

  $("#d-title").value = t.title;
  $("#d-col").innerHTML = state.columns.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#d-col").value = t.column;
  $("#d-prio").value = t.priority;
  $("#d-tags").value = t.tags.join(", ");
  $("#d-notes").value = t.notes;

  const kids = children(t.id);
  $("#d-subcount").textContent = kids.length ? `(${kids.filter(isDone).length}/${kids.length} done)` : "";
  const ul = $("#d-subs");
  ul.innerHTML = "";
  for (const k of kids) {
    const li = document.createElement("li");
    li.className = isDone(k) ? "done" : "";
    const n = children(k.id).length;
    li.innerHTML = `<input type="checkbox" ${isDone(k) ? "checked" : ""} title="Done">
      <span class="t">${esc(k.title)}</span>${n ? `<span class="n">${n} sub</span>` : ""}
      <span class="c">${esc((column(k.column) || {}).name || "")}</span>`;
    li.querySelector("input").onchange = (e) => { moveTask(k.id, e.target.checked ? doneCol() : firstOpenCol(), null, false); renderDetail(); };
    li.querySelector(".t").onclick = () => { openId = k.id; renderDetail(); };
    ul.appendChild(li);
  }
  $("#d-newsub").value = "";
  renderAgent(t);
  $("#d-dates").textContent = `Created ${fmt(t.created)} · Updated ${fmt(t.updated)}`;
  disarmDelete();
}

$("#d-title").addEventListener("input", (e) => { const t = task(openId); t.title = e.target.value; touch(t); });
$("#d-title").addEventListener("blur", (e) => { const t = task(openId); if (t && !t.title.trim()) { t.title = "Untitled"; e.target.value = t.title; touch(t); } });
$("#d-notes").addEventListener("input", (e) => { const t = task(openId); t.notes = e.target.value; touch(t); });
$("#d-tags").addEventListener("input", (e) => { const t = task(openId); t.tags = parseTags(e.target.value); touch(t); });
$("#d-prio").addEventListener("change", (e) => { const t = task(openId); t.priority = e.target.value; touch(t); });
$("#d-col").addEventListener("change", (e) => { moveTask(openId, e.target.value, null); renderDetail(); });
$("#d-newsub").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const parent = task(openId);
  addTask(e.target.value, isDone(parent) ? firstOpenCol() : parent.column, parent.id);
  renderDetail(); $("#d-newsub").focus();
});
$("#d-close").onclick = closeDetail;
$("#overlay").addEventListener("mousedown", (e) => { if (e.target.id === "overlay") closeDetail(); });

// Two-step delete instead of window.confirm (a modal dialog blocks browser automation).
let deleteArmed = false;
function disarmDelete() { deleteArmed = false; const b = $("#d-delete"); b.classList.remove("armed"); b.textContent = "Delete"; }
$("#d-delete").onclick = () => {
  const t = task(openId);
  if (!deleteArmed) {
    const n = descendants(t.id).length;
    deleteArmed = true;
    $("#d-delete").classList.add("armed");
    $("#d-delete").textContent = n ? `Delete with ${n} subtask${n > 1 ? "s" : ""}?` : "Really delete?";
    return;
  }
  const parent = t.parent;
  deleteTask(t.id);
  if (parent && task(parent)) { openId = parent; renderDetail(); } else closeDetail();
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) closeDetail();
  else if (e.key === "/" && !openId && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); $("#search").focus(); }
});

// ---------------------------------------------------------------- Send to Claude
// server.py starts `claude --bg` for the task; the board only keeps { id, started, state } on it.
const agentLabel = (a) => ({ working: "working", done: "finished", gone: "removed", starting: "starting" }[a.state] || a.state || "?");
const colNamed = (re) => state.columns.find((c) => !c.done && re.test(c.name));

function renderAgent(t) {
  const box = $("#d-agent");
  const running = t.agent && (t.agent.state === "working" || t.agent.state === "starting");
  box.innerHTML = `<button class="btn primary" id="d-send" ${running || !useServer ? "disabled" : ""}
      title="${useServer ? "Start a background Claude session on this task" : "Needs server.py"}">${t.agent ? "Send to Claude again" : "Send to Claude"}</button>
    ${t.agent ? `<span>${esc(agentLabel(t.agent))} · started ${fmt(t.agent.started)}</span>
      <code title="Click to copy">claude attach ${esc(t.agent.id)}</code>` : ""}`;
  $("#d-send").onclick = () => sendToClaude(t);
  const code = box.querySelector("code");
  if (code) code.onclick = () => { navigator.clipboard.writeText(code.textContent); setStatus("Copied " + code.textContent); };
}

async function sendToClaude(t) {
  $("#d-send").disabled = true;
  setStatus("Starting Claude…");
  if (saveTimer) { clearTimeout(saveTimer); await flush(); }   // server builds the prompt from tasks.json
  try {
    const r = await fetch("/api/agent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ taskId: t.id }) });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error || r.status);
    t.agent = { id: res.id, started: now(), state: "starting" };
    const prog = colNamed(/progress|doing/i);
    if (prog && t.column !== prog.id) moveTask(t.id, prog.id, null); else touch(t);
    setStatus("Claude session " + res.id + " started");
  } catch (e) {
    setStatus("Send to Claude failed: " + e.message, true);
  }
  if (openId === t.id) renderDetail();
  render();
  pollAgents();
}

let pollTimer = null;
async function pollAgents() {
  clearTimeout(pollTimer);
  const live = state.tasks.filter((t) => t.agent && (t.agent.state === "working" || t.agent.state === "starting"));
  if (!useServer || !live.length) return;
  try {
    const r = await fetch("/api/agents?ids=" + live.map((t) => t.agent.id).join(","), { cache: "no-store" });
    const states = await r.json();
    if (!r.ok) throw new Error(states.error || r.status);
    let changed = false;
    for (const t of live) {
      const st = states[t.agent.id];
      if (!st || st === t.agent.state) continue;
      t.agent.state = st;
      changed = true;
      // A finished session parks the task in Review, if the board has such a column.
      const review = colNamed(/review/i);
      if (st === "done" && review && !isDone(t) && t.column !== review.id) moveTask(t.id, review.id, null);
      else touch(t);
    }
    // Refresh only the Claude row and column so a poll never resets text being typed in the panel.
    if (changed) { render(); const o = openId && task(openId); if (o) { renderAgent(o); $("#d-col").value = o.column; } }
  } catch (e) {
    setStatus("Claude status check failed: " + e.message, true);
  }
  pollTimer = setTimeout(pollAgents, 8000);
}

// ---------------------------------------------------------------- misc
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(iso) { return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—"; }

$("#search").addEventListener("input", render);
$("#show-subs").addEventListener("change", () => {
  try { localStorage.setItem(LS_KEY + ":subs", $("#show-subs").checked ? "1" : "0"); } catch (_) {}
  render();
});
try { if (localStorage.getItem(LS_KEY + ":subs") === "0") $("#show-subs").checked = false; } catch (_) {}

load().then(() => { render(); setStatus(useServer ? "Saving to tasks.json" : "Saving in this browser"); pollAgents(); });
</script>
</body>
</html>
