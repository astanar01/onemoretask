<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
:root {
  --ts: 1;
  --bg: #f4f2ee; --col: #e9e6df; --card: #ffffff; --text: #1f1d1a; --muted: #6f6a61;
  --line: #d6d1c7; --accent: #7a4fd6; --accent-soft: #ece4fb; --danger: #c0392b;
  --drop: #7a4fd6; --shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04);
  --p-high: #d9534f; --p-med: #e0a100; --p-low: #3c9d6b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a; --col: #211f25; --card: #2b2830; --text: #ece9f1; --muted: #a29ca9;
    --line: #3a3640; --accent: #a88af0; --accent-soft: #332a47; --danger: #e8685c;
    --drop: #a88af0; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: calc(14px * var(--ts))/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: calc(17px * var(--ts)); margin: 0 8px 0 0; }
header .grow { flex: 1; }
#search { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); min-width: 200px; }
label.toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); user-select: none; }
#status { color: var(--muted); font-size: calc(12px * var(--ts)); }
#status.err { color: var(--danger); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 10px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
#project { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); max-width: 260px; font-weight: 600; }
#project-path { padding: 5px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--card); min-width: 320px; display: none; }
#text-size { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
#banner { display: none; padding: 8px 16px; background: var(--accent-soft); font-size: calc(13px * var(--ts)); }

#board { flex: 1; display: flex; gap: 12px; padding: 16px; overflow-x: auto; align-items: flex-start; }
.column { background: var(--col); border-radius: 10px; width: 290px; min-width: 290px; display: flex; flex-direction: column; max-height: 100%; }
.column.col-drag { opacity: .4; }
.col-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 12px; cursor: grab; }
.col-head .name { font-weight: 600; flex: 1; border: 0; background: transparent; padding: 2px 4px; border-radius: 4px; min-width: 0; }
.col-head .name:focus { background: var(--card); outline: 1px solid var(--accent); }
.col-head .count { color: var(--muted); font-size: calc(12px * var(--ts)); }
.col-head .icon { border: 0; background: transparent; color: var(--muted); padding: 2px 5px; border-radius: 4px; }
.col-head .icon:hover { background: var(--line); color: var(--text); }
.col-head .done-flag { font-size: calc(11px * var(--ts)); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.cards { padding: 4px 8px 8px; overflow-y: auto; min-height: 40px; display: flex; flex-direction: column; gap: 8px; }
.drop-line { height: 3px; background: var(--drop); border-radius: 2px; margin: -2px 0; }

.card { background: var(--card); border-radius: 8px; padding: 9px 10px; box-shadow: var(--shadow); cursor: grab; }
.card:hover { outline: 1px solid var(--line); }
.group { display: flex; flex-direction: column; gap: 6px; }
.group.dragging { opacity: .35; }
.children { display: flex; flex-direction: column; gap: 6px; margin-left: 12px; padding-left: 8px; border-left: 2px solid var(--line); }
.children:empty, .group.collapsed > .children { display: none; }
.card .row { display: flex; align-items: flex-start; gap: 4px; }
.card .row .title { flex: 1; min-width: 0; }
.twisty { border: 0; background: transparent; color: var(--muted); width: 22px; height: 20px; padding: 0; margin-left: -4px; border-radius: 4px; flex: none; display: grid; place-items: center; }
.twisty svg { transition: transform .12s; }
.twisty.shut svg { transform: rotate(-90deg); }
.twisty:hover { background: var(--line); color: var(--text); }
.hidden-count { font-size: calc(11px * var(--ts)); color: var(--muted); background: var(--col); border-radius: 8px; padding: 0 6px; align-self: center; }
.prio { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 2px; }
.prio.p-high { background: var(--p-high); }
.prio.p-med { background: var(--p-med); }
.prio.p-low { background: var(--p-low); }
.card.is-done .title { text-decoration: line-through; color: var(--muted); }
.card .parent { font-size: calc(11px * var(--ts)); color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .title { word-wrap: break-word; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: calc(12px * var(--ts)); color: var(--muted); }
.tag { background: var(--accent-soft); color: var(--text); border-radius: 4px; padding: 0 6px; font-size: calc(11px * var(--ts)); }
.progress { display: flex; align-items: center; gap: 6px; }
.progress .bar { width: 50px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); }

.add-card { margin: 0 8px 8px; }
.add-card button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 6px; }
.add-card button:hover { background: var(--line); color: var(--text); }
.add-col { min-width: 220px; }

/* detail panel */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; justify-content: center; align-items: flex-start; padding: 6vh 16px; overflow-y: auto; }
#overlay.open { display: flex; }
#panel { background: var(--bg); border-radius: 12px; width: 1288px; max-width: 100%; padding: 20px 28px 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#panel .crumb { font-size: calc(12px * var(--ts)); color: var(--muted); margin-bottom: 6px; }
#panel .crumb a { color: var(--accent); cursor: pointer; }
#d-title { width: 100%; font-size: calc(18px * var(--ts)); font-weight: 600; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 6px; }
#d-title:hover, #d-title:focus { border-color: var(--line); background: var(--card); outline: none; }
.panel-cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px; align-items: start; }
.panel-right { border-left: 1px solid var(--line); padding: 0 8px 0 28px; }
.actions { display: flex; gap: 10px; align-items: center; }
.panel-right #d-agent { gap: 10px 12px; margin-top: 4px; }
.panel-right #d-log { margin-top: 18px; gap: 26px; padding-right: 6px; }
.panel-right #d-log li { padding: 2px 0 2px 16px; }
.panel-right #d-log li .who { margin-bottom: 8px; }
.panel-right #d-reply-wrap { margin-top: 14px; gap: 12px; }
.panel-right > .block:first-child, .panel-left > .fields:first-child { margin-top: 12px; }
.panel-right #d-log { max-height: 62vh; }
@media (max-width: 820px) {
  .panel-cols { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .panel-right { border-left: 0; padding: 0; }
  .panel-right #d-log { max-height: 260px; }
}
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.fields label, .block > label { display: block; font-size: calc(12px * var(--ts)); color: var(--muted); margin-bottom: 3px; }
.fields select, .fields input, #d-notes { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
#d-notes { min-height: 90px; resize: vertical; }
.block { margin-top: 14px; }
.sub-list { list-style: none; margin: 4px 0 6px; padding: 0; }
.sub-list li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; }
.sub-list li:hover { background: var(--card); }
.sub-list li .t { flex: 1; cursor: pointer; }
.sub-list li.done .t { text-decoration: line-through; color: var(--muted); }
.sub-list li .c { font-size: calc(11px * var(--ts)); color: var(--muted); }
.sub-list li .n { font-size: calc(11px * var(--ts)); color: var(--muted); }
#d-title:read-only, #d-tags:read-only, #d-notes:read-only { color: var(--muted); cursor: default; }
#d-title:read-only:hover { border-color: transparent; background: transparent; }
#d-newsub { width: 100%; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; }
:root { --wait: #e67e22; --ok: #3c9d6b; }
.agent { font-size: calc(11px * var(--ts)); border-radius: 4px; padding: 0 6px; background: var(--accent-soft); color: var(--accent); }
.agent.working { background: var(--accent); color: #fff; }
.agent.needs_you { background: var(--wait); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
.agent.finished { background: var(--ok); color: #fff; }
@keyframes pulse { 50% { opacity: .55; } }
.ttl { font-size: calc(11px * var(--ts)); border-radius: 4px; padding: 0 6px; border: 1px solid var(--ok); color: var(--ok); white-space: nowrap; }
.ttl.low { border-color: var(--wait); color: var(--wait); }
.ttl.cold { border-color: #c0392b; background: #c0392b; color: #fff; }
.card.needs-you { outline: 2px solid var(--wait); }
.card.unread { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.card.unread .title { font-weight: 600; }
.card.unread .title::before { content: "●"; color: var(--accent); margin-right: 6px; font-size: .8em; vertical-align: 1px; }
.card .agent-note { margin-top: 5px; font-size: calc(12px * var(--ts)); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#waiting { display: none; background: var(--wait); color: #fff; border: 0; border-radius: 12px; padding: 3px 10px; font-size: calc(12px * var(--ts)); }
#d-agent { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: calc(12px * var(--ts)); color: var(--muted); }
#d-agent code { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; cursor: copy; }
#d-log { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
#d-log li { padding: 2px 0 2px 12px; line-height: 1.55; border-left: 3px solid var(--line); word-wrap: break-word; }
#d-log li .msg { white-space: pre-wrap; }
#d-log li.k-question { border-left-color: var(--wait); }
#d-log li.k-done { border-left-color: var(--ok); }
#d-log li.k-you { border-left-color: var(--accent); }
#d-log li .who { font-size: calc(11px * var(--ts)); color: var(--muted); display: block; }
#d-reply-wrap { display: none; margin-top: 8px; gap: 8px; align-items: flex-end; }
#d-reply { flex: 1; min-height: 54px; resize: vertical; padding: 6px 8px; border: 1px solid var(--wait); border-radius: 6px; background: var(--card); }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.thumbs:empty { display: none; }
.thumb { position: relative; display: block; width: 96px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--card); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .x { position: absolute; top: 2px; right: 2px; border: 0; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: calc(11px * var(--ts)); line-height: 1; padding: 3px 5px; display: none; }
.thumb:hover .x { display: block; }
#d-log .thumb { width: 120px; height: 80px; }
.hint { font-size: calc(11px * var(--ts)); color: var(--muted); margin-top: 4px; }
#panel.drop-target { outline: 2px dashed var(--accent); outline-offset: -6px; }
#d-reply-box { flex: 1; display: flex; flex-direction: column; }
.panel-foot { display: flex; justify-content: space-between; margin-top: 18px; color: var(--muted); font-size: calc(12px * var(--ts)); align-items: center; }
</style>
</head>
<body>
<header>
  <h1>Task Board</h1>
  <select id="project" title="Project"></select>
  <input id="project-path" placeholder="Folder path — Enter to open, Esc to cancel">
  <input id="search" type="search" placeholder="Filter tasks…">
  <label class="toggle"><input type="checkbox" id="show-subs" checked> Show subtasks on board</label>
  <span class="grow"></span>
  <label class="toggle">Text <select id="text-size" title="Text size"><option value="0.9">Small</option><option value="1" selected>Normal</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></label>
  <button id="waiting" title="Open the next task where Claude is waiting on you"></button>
  <span id="status"></span>
</header>
<div id="banner">Not running through <code>server.py</code>: tasks are saved in this browser only. Run <code>python3 server.py</code> (next to this page) to save them to the project's <code>tasks.json</code>.</div>
<main id="board"></main>

<div id="overlay">
  <div id="panel">
    <div class="crumb" id="d-crumb"></div>
    <input id="d-title" placeholder="Task title">
    <div class="panel-cols">
    <div class="panel-left">
    <div class="fields">
      <div><label for="d-col">Column</label><select id="d-col"></select></div>
      <div><label for="d-prio">Priority</label>
        <select id="d-prio"><option value="">None</option><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select></div>
      <div style="grid-column: 1 / -1"><label for="d-tags">Tags (comma separated)</label><input id="d-tags"></div>
    </div>
    <div class="block"><label for="d-notes">Notes</label><textarea id="d-notes"></textarea>
      <div class="thumbs" id="d-images"></div>
      <div class="hint" id="d-img-hint">Paste (⌘V) or drop an image to attach it — Claude gets it with the task.</div></div>
    <div class="block" id="d-subblock">
      <label>Subtasks <span id="d-subcount"></span></label>
      <ul class="sub-list" id="d-subs"></ul>
      <input id="d-newsub" placeholder="+ Add a subtask and press Enter">
    </div>
    <div class="block actions"><button class="btn primary" id="d-send"></button><button class="btn danger" id="d-delete">Delete</button></div>
    </div>
    <div class="panel-right" id="d-right">
    <div class="block"><label>Claude</label><div id="d-agent"></div>
      <ul id="d-log"></ul>
      <div id="d-reply-wrap"><div id="d-reply-box"><textarea id="d-reply" placeholder="Answer Claude — Cmd+Enter to send, paste images to attach"></textarea><div class="thumbs" id="d-reply-images"></div></div><button class="btn primary" id="d-reply-send">Send reply</button></div>
    </div>
    </div>
    </div>
    <div class="panel-foot">
      <span id="d-dates"></span>
      <button class="btn primary" id="d-close">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";
const LS_KEY = "task-board";
const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();

let state = null;          // { version, columns:[{id,name,done}], tasks:[{id,title,notes,priority,tags,column,parent,order,created,updated}] }
let useServer = true;
let projects = [];         // [{ id, path, name, board }] from server.py, most recent first
let P = null;              // current project id; every /api call carries it
let openId = null;         // task shown in the detail panel
let draftId = null;        // task made by "+ Add task"; dropped on close if left empty
let drag = null;           // { kind:'card'|'col', id }

function defaultState() {
  const cols = [["To Do", false], ["In Progress", false], ["Review", false], ["Done", true]]
    .map(([name, done]) => ({ id: uid(), name, done }));
  return { version: 1, columns: cols, tasks: [] };
}

// ---------------------------------------------------------------- persistence
async function load() {
  try {
    const r = await fetch("/api/projects", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    projects = await r.json();
  } catch (e) {
    useServer = false;
    $("#banner").style.display = "block";
    try { state = JSON.parse(localStorage.getItem(LS_KEY)); } catch (_) { state = null; }
    state = state || defaultState();
    return;
  }
  let last = null;
  try { last = localStorage.getItem(LS_KEY + ":project"); } catch (_) {}
  const want = new URLSearchParams(location.hash.slice(1)).get("p") || last;
  P = (projects.find((p) => p.id === want) || projects[0] || {}).id || null;
  await loadTasks();
}
async function loadTasks() {
  state = defaultState();
  if (P) {
    const r = await fetch(api("/api/tasks"), { cache: "no-store" });
    if (!r.ok) throw new Error("server said " + r.status);
    state = (await r.json()) || defaultState();
  }
  const p = project();
  try { if (P) localStorage.setItem(LS_KEY + ":project", P); } catch (_) {}
  history.replaceState(null, "", P ? "#p=" + P : location.pathname);
  $("#board").style.display = P ? "" : "none";
  renderProjects();
  updateWaiting();
  if (p) setStatus("Saving to " + p.board.replace(p.path, p.name) + "/tasks.json");
  else setStatus("Open a project folder to start");
}
const api = (url) => url + "?p=" + encodeURIComponent(P);
const project = () => projects.find((p) => p.id === P);

// ---------------------------------------------------------------- projects
function renderProjects() {
  const sel = $("#project");
  sel.style.display = useServer ? "" : "none";
  const dup = (n) => projects.filter((p) => p.name === n).length > 1;
  sel.innerHTML = (P ? "" : `<option value="" disabled>No project</option>`)
    + projects.map((p) => `<option value="${p.id}" title="${esc(p.path)}">${esc(dup(p.name) ? p.path.replace(/^\/Users\/[^/]+/, "~") : p.name)}</option>`).join("")
    + `<option disabled>──────────</option><option value=":pick">Open folder…</option><option value=":path">Open a path…</option>`
    + (P ? `<option value=":forget">Remove this project from the list</option>` : "");
  sel.value = P || "";
  sel.title = project() ? project().path : "Project";
}

async function switchProject(id) {
  if (saveTimer) await flush();
  openId = null; replyImages = []; $("#overlay").classList.remove("open");
  P = id; agents = {}; polledOnce = false;
  try { await loadTasks(); } catch (e) { setStatus("Could not load the board: " + e.message, true); }
  render(); pollAgents();
}

async function openFolder(how, path) {
  setStatus(how === "pick" ? "Choose a folder in the dialog…" : "Opening…");
  try {
    const res = how === "pick" ? await post("/api/projects/pick", {}) : await post("/api/projects", { path });
    if (res.cancelled) { setStatus(""); return; }
    projects = await (await fetch("/api/projects", { cache: "no-store" })).json();
    await switchProject(res.id);
  } catch (e) {
    setStatus("Open folder failed: " + e.message, true);
    if (how === "pick") showPathInput();
  }
}

function showPathInput() { const i = $("#project-path"); i.style.display = "inline-block"; i.focus(); }
$("#project-path").addEventListener("keydown", (e) => {
  const i = e.target;
  if (e.key === "Escape") { i.value = ""; i.style.display = "none"; }
  else if (e.key === "Enter" && i.value.trim()) { openFolder("path", i.value.trim()); i.value = ""; i.style.display = "none"; }
});

$("#project").addEventListener("change", async (e) => {
  const v = e.target.value;
  renderProjects();   // the action options are not places to stay on
  if (v === ":pick") openFolder("pick");
  else if (v === ":path") showPathInput();
  else if (v === ":forget") {
    await post("/api/projects/forget", { p: P });
    projects = projects.filter((p) => p.id !== P);
    await switchProject(projects.length ? projects[0].id : null);
  } else if (v && v !== P) switchProject(v);
});

let saveTimer = null;
function save() {
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
}
async function flush(keepalive = false) {
  clearTimeout(saveTimer);
  saveTimer = null;
  const body = JSON.stringify(state);
  if (useServer && !P) return;
  try {
    if (useServer) {
      const r = await fetch(api("/api/tasks"), { method: "PUT", headers: { "Content-Type": "application/json" }, body, keepalive });
      if (!r.ok) throw new Error("server said " + r.status);
    } else {
      localStorage.setItem(LS_KEY, body);
    }
    setStatus("Saved");
  } catch (e) {
    setStatus("Save failed: " + e.message, true);
  }
}
function setStatus(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }
// keepalive lets the pending save finish after the page is gone.
window.addEventListener("pagehide", () => { if (saveTimer) flush(true); });

// ---------------------------------------------------------------- model helpers
const task = (id) => state.tasks.find((t) => t.id === id);
const column = (id) => state.columns.find((c) => c.id === id);
const children = (id) => state.tasks.filter((t) => t.parent === id).sort((a, b) => a.order - b.order);
const isDone = (t) => !!(column(t.column) || {}).done;
const firstOpenCol = () => (state.columns.find((c) => !c.done) || state.columns[0]).id;
const doneCol = () => (state.columns.find((c) => c.done) || state.columns[state.columns.length - 1]).id;
function descendants(id) { return children(id).flatMap((c) => [c, ...descendants(c.id)]); }
function nextOrder(colId) {
  const inCol = state.tasks.filter((t) => t.column === colId);
  return inCol.length ? Math.max(...inCol.map((t) => t.order)) + 1 : 0;
}

function addTask(title, colId, parent = null) {
  const t = { id: uid(), title: title.trim(), notes: "", priority: "", tags: [], column: colId,
              parent, order: nextOrder(colId), created: now(), updated: now() };
  state.tasks.push(t);
  save();
  return t;
}
function touch(t) { t.updated = now(); save(); }

// The subtasks drawn nested under `t` in column `colId` (same-column chain only).
function nestedIn(t, colId) { return children(t.id).filter((c) => c.column === colId).flatMap((c) => [c, ...nestedIn(c, colId)]); }

// Put task `id` into column `colId`, just before sibling `beforeId` (null = at the end).
// `carry` brings along the subtasks nested under it in its old column.
function moveTask(id, colId, beforeId, carry = true) {
  const t = task(id);
  const carried = carry && t.column !== colId ? nestedIn(t, t.column) : [];
  const moving = new Set([t.id, ...carried.map((x) => x.id)]);
  const list = state.tasks.filter((x) => x.column === colId && !moving.has(x.id)).sort((a, b) => a.order - b.order);
  let idx = beforeId ? list.findIndex((x) => x.id === beforeId) : -1;
  if (idx < 0) idx = list.length;
  list.splice(idx, 0, t, ...carried);
  list.forEach((x, i) => (x.order = i));
  for (const x of moving) task(x).column = colId;
  touch(t);
}

// Collapsed groups are a per-browser view preference, so they stay out of tasks.json.
const collapsed = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY + ":collapsed") || "[]").forEach((id) => collapsed.add(id)); } catch (_) {}
function toggleCollapsed(id) {
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  try { localStorage.setItem(LS_KEY + ":collapsed", JSON.stringify([...collapsed])); } catch (_) {}
  render();
}

// Unread = a Review card whose Claude log has an entry newer than the last time you opened it.
// Per-browser like `collapsed`; with no stored map yet, the first poll marks everything read.
let seen = null;
try { seen = JSON.parse(localStorage.getItem(LS_KEY + ":seen")); } catch (_) {}
const seenPrimed = !!seen;
seen = seen || {};
const lastClaudeAt = (id) => {
  const log = (agents[id] && agents[id].log) || [];
  for (let i = log.length - 1; i >= 0; i--) if (log[i].from !== "you") return Date.parse(log[i].at) || 0;
  return 0;
};
function isUnread(t) {
  const review = colNamed(/review/i);
  return !!(t.agent && review && t.column === review.id && lastClaudeAt(t.id) > (seen[t.id] || 0));
}
function markSeen(ids) {
  let changed = false;
  for (const id of ids) { const at = lastClaudeAt(id); if (at > (seen[id] || 0)) { seen[id] = at; changed = true; } }
  if (changed) try { localStorage.setItem(LS_KEY + ":seen", JSON.stringify(seen)); } catch (_) {}
  return changed;
}

function deleteTask(id) {
  const gone = new Set([id, ...descendants(id).map((t) => t.id)]);
  state.tasks = state.tasks.filter((t) => !gone.has(t.id));
  save();
}

function parseTags(s) { return s.split(",").map((x) => x.trim()).filter(Boolean); }

// ---------------------------------------------------------------- board rendering
function matches(t, q) {
  if (!q) return true;
  const hay = [t.title, t.notes, ...(t.tags || [])].join(" ").toLowerCase();
  return hay.includes(q);
}

function render() {
  queueMicrotask(tickCache);   // fill the cache chips this render creates
  const board = $("#board");
  const q = $("#search").value.trim().toLowerCase();
  const showSubs = $("#show-subs").checked;
  board.innerHTML = "";

  for (const col of state.columns) {
    const el = document.createElement("section");
    el.className = "column";
    el.dataset.col = col.id;

    const cards = state.tasks
      .filter((t) => t.column === col.id && (showSubs || !t.parent) && matches(t, q))
      .sort((a, b) => a.order - b.order);
    const shown = new Set(cards.map((t) => t.id));
    const kidsOf = (id) => cards.filter((t) => t.parent === id);

    const head = document.createElement("div");
    head.className = "col-head";
    head.draggable = true;
    head.innerHTML = `<input class="name" value="${esc(col.name)}" title="Rename column">
      ${col.done ? '<span class="done-flag" title="Tasks here count as done">done</span>' : ""}
      <span class="count">${cards.length}</span>
      <button class="icon" data-act="done" title="Toggle: tasks in this column count as done">✓</button>
      <button class="icon" data-act="del" title="Delete column (only when empty)">✕</button>`;
    const name = head.querySelector(".name");
    name.addEventListener("change", () => { col.name = name.value.trim() || col.name; save(); render(); });
    name.addEventListener("keydown", (e) => { if (e.key === "Enter") name.blur(); });
    name.addEventListener("mousedown", (e) => e.stopPropagation());
    head.querySelector('[data-act="done"]').onclick = () => { col.done = !col.done; save(); render(); };
    head.querySelector('[data-act="del"]').onclick = () => {
      if (state.tasks.some((t) => t.column === col.id)) { setStatus(`"${col.name}" still has tasks — move them first`, true); return; }
      if (state.columns.length <= 1) return;
      state.columns = state.columns.filter((c) => c !== col); save(); render();
    };
    head.addEventListener("dragstart", (e) => {
      if (e.target !== head) return;
      drag = { kind: "col", id: col.id }; el.classList.add("col-drag");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", col.id);
    });
    head.addEventListener("dragend", () => { drag = null; render(); });
    el.appendChild(head);

    const list = document.createElement("div");
    list.className = "cards";
    // A subtask nests under its parent when the parent is shown in this column too.
    for (const t of cards) if (!shown.has(t.parent)) list.appendChild(groupEl(t, kidsOf, true));
    el.appendChild(list);

    el.addEventListener("dragover", (e) => onDragOver(e, el, list));
    el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) clearDropLine(); });
    el.addEventListener("drop", (e) => onDrop(e, col));

    el.appendChild(addCardEl(col));
    board.appendChild(el);
  }

  const addCol = document.createElement("div");
  addCol.className = "add-col";
  addCol.innerHTML = `<button class="btn">+ Add column</button>`;
  addCol.firstChild.onclick = () => {
    const doneIdx = state.columns.findIndex((c) => c.done);
    const c = { id: uid(), name: "New column", done: false };
    state.columns.splice(doneIdx < 0 ? state.columns.length : doneIdx, 0, c);
    save(); render();
    const inp = document.querySelector(`[data-col="${c.id}"] .name`); inp.focus(); inp.select();
  };
  board.appendChild(addCol);
}

function groupEl(t, kidsOf, top) {
  const g = document.createElement("div");
  g.className = "group" + (collapsed.has(t.id) ? " collapsed" : "");
  g.dataset.id = t.id;
  const kids = kidsOf(t.id);
  g.appendChild(cardEl(t, top, kids.length));
  const box = document.createElement("div");
  box.className = "children";
  for (const k of kids) box.appendChild(groupEl(k, kidsOf, false));
  g.appendChild(box);
  return g;
}

function cardEl(t, top, nestedCount) {
  const el = document.createElement("div");
  const ag = t.agent && agents[t.id];
  el.className = "card" + (isDone(t) ? " is-done" : "") + (ag && ag.phase === "needs_you" ? " needs-you" : "") + (isUnread(t) ? " unread" : "");
  el.draggable = true;
  el.dataset.id = t.id;
  const kids = descendants(t.id);
  const doneKids = kids.filter(isDone).length;
  const parent = top && t.parent && task(t.parent);
  const shut = collapsed.has(t.id);
  el.innerHTML = `
    ${parent ? `<div class="parent">↳ ${esc(parent.title)}</div>` : ""}
    <div class="row">
      ${nestedCount ? `<button class="twisty${shut ? " shut" : ""}" title="${shut ? "Expand" : "Collapse"} subtasks"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}
      <div class="title">${t.priority ? `<span class="prio p-${t.priority}" title="${{ high: "High", med: "Medium", low: "Low" }[t.priority]} priority"></span>` : ""}${esc(t.title)}</div>
      ${nestedCount && shut ? `<span class="hidden-count" title="Hidden subtasks">+${nestedCount}</span>` : ""}
    </div>
    ${(kids.length || t.tags.length || t.notes || t.agent || (t.images || []).length) ? `<div class="meta">
      ${kids.length ? `<span class="progress" title="${doneKids} of ${kids.length} subtasks done"><span class="bar"><i style="width:${(100 * doneKids / kids.length).toFixed(0)}%"></i></span>${doneKids}/${kids.length}</span>` : ""}
      ${t.notes ? `<span title="Has notes">≡</span>` : ""}
      ${(t.images || []).length ? `<span title="${t.images.length} image${t.images.length > 1 ? "s" : ""}">▣ ${t.images.length}</span>` : ""}
      ${t.agent ? `<span class="agent ${ag ? ag.phase : ""}" title="Claude session ${t.agent.id}">Claude: ${esc(phaseLabel(ag))}</span>${cacheChip(ag, false)}` : ""}
      ${t.tags.map((g) => `<span class="tag">${esc(g)}</span>`).join("")}
    </div>` : ""}
    ${ag && ag.reason && ag.phase !== "working" ? `<div class="agent-note">${esc(ag.reason)}</div>` : ""}`;
  el.addEventListener("click", () => openDetail(t.id));
  const tw = el.querySelector(".twisty");
  if (tw) tw.addEventListener("click", (e) => { e.stopPropagation(); toggleCollapsed(t.id); });
  el.addEventListener("dragstart", (e) => {
    e.stopPropagation();
    drag = { kind: "card", id: t.id };
    e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", t.id);
    requestAnimationFrame(() => el.parentElement.classList.add("dragging"));
  });
  el.addEventListener("dragend", () => { drag = null; clearDropLine(); el.parentElement.classList.remove("dragging"); render(); });
  return el;
}

function addCardEl(col) {
  const wrap = document.createElement("div");
  wrap.className = "add-card";
  const btn = document.createElement("button");
  btn.textContent = "+ Add task";
  btn.onclick = () => { const t = addTask("", col.id); draftId = t.id; render(); openDetail(t.id); };
  wrap.appendChild(btn);
  return wrap;
}

// ---------------------------------------------------------------- drag & drop
let dropLine = null;
function clearDropLine() { if (dropLine) { dropLine.remove(); dropLine = null; } }

function onDragOver(e, colEl, list) {
  if (!drag) return;
  e.preventDefault();
  if (drag.kind === "col") return;
  // A card drops among its siblings: inside its parent's group if the parent is in this column.
  const t = task(drag.id);
  const pg = t.parent && list.querySelector(`.group[data-id="${t.parent}"]`);
  const box = pg ? pg.querySelector(":scope > .children") : list;
  if (pg) pg.classList.remove("collapsed");
  const before = groupAfterPointer(box, e.clientY);
  if (!dropLine) { dropLine = document.createElement("div"); dropLine.className = "drop-line"; }
  if (before) box.insertBefore(dropLine, before); else box.appendChild(dropLine);
}

function groupAfterPointer(box, y) {
  for (const g of box.querySelectorAll(":scope > .group:not(.dragging)")) {
    const r = g.firstElementChild.getBoundingClientRect();
    if (y < r.top + r.height / 2) return g;
  }
  return null;
}

function onDrop(e, col) {
  e.preventDefault();
  if (!drag) return;
  if (drag.kind === "col") {
    const from = state.columns.findIndex((c) => c.id === drag.id);
    const to = state.columns.indexOf(col);
    if (from >= 0 && from !== to) { const [c] = state.columns.splice(from, 1); state.columns.splice(to, 0, c); save(); }
  } else {
    let next = dropLine && dropLine.nextElementSibling;
    while (next && (!next.classList.contains("group") || next.classList.contains("dragging"))) next = next.nextElementSibling;
    moveTask(drag.id, col.id, next ? next.dataset.id : null);
  }
  drag = null; clearDropLine(); render();
}

// ---------------------------------------------------------------- detail panel
function openDetail(id) {
  if (id !== openId) replyImages = [];
  openId = id;
  if (markSeen([id])) render();
  $("#overlay").classList.add("open");
  renderDetail();
  $("#d-title").focus();
}
function closeDetail() { settleDraft(); openId = null; replyImages = []; $("#overlay").classList.remove("open"); render(); }

// A fresh "+ Add task" draft closed with nothing in it vanishes; with content but no title it gets "Untitled".
function settleDraft() {
  const t = draftId && task(draftId);
  draftId = null;
  if (!t || t.title.trim()) return;
  if (!t.notes.trim() && !t.tags.length && !t.priority && !(t.images || []).length && !children(t.id).length && !t.agent) deleteTask(t.id);
  else { t.title = "Untitled"; touch(t); }
}

function renderDetail() {
  const t = task(openId);
  if (!t) { closeDetail(); return; }
  const chain = [];
  for (let p = t.parent && task(t.parent); p; p = p.parent && task(p.parent)) chain.unshift(p);
  $("#d-crumb").innerHTML = chain.length
    ? "Subtask of " + chain.map((p) => `<a data-id="${p.id}">${esc(p.title)}</a>`).join(" › ")
    : "Task";
  $("#d-crumb").querySelectorAll("a").forEach((a) => (a.onclick = () => { openId = a.dataset.id; renderDetail(); }));

  $("#d-title").value = t.title;
  $("#d-col").innerHTML = state.columns.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#d-col").value = t.column;
  $("#d-prio").value = t.priority;
  $("#d-tags").value = t.tags.join(", ");
  $("#d-notes").value = t.notes;
  // Once sent, the prompt Claude got is fixed: title, tags, notes, images and new subtasks lock. Replies carry anything new.
  const sent = !!t.agent;
  for (const id of ["#d-title", "#d-tags", "#d-notes"]) $(id).readOnly = sent;
  $("#d-newsub").style.display = sent ? "none" : "";
  renderImages(t);

  const kids = children(t.id);
  $("#d-subcount").textContent = kids.length ? `(${kids.filter(isDone).length}/${kids.length} done)` : "";
  const ul = $("#d-subs");
  ul.innerHTML = "";
  for (const k of kids) {
    const li = document.createElement("li");
    li.className = isDone(k) ? "done" : "";
    const n = children(k.id).length;
    li.innerHTML = `<input type="checkbox" ${isDone(k) ? "checked" : ""} title="Done">
      <span class="t">${esc(k.title)}</span>${n ? `<span class="n">${n} sub</span>` : ""}
      <span class="c">${esc((column(k.column) || {}).name || "")}</span>`;
    li.querySelector("input").onchange = (e) => { moveTask(k.id, e.target.checked ? doneCol() : firstOpenCol(), null, false); renderDetail(); };
    li.querySelector(".t").onclick = () => { openId = k.id; renderDetail(); };
    ul.appendChild(li);
  }
  $("#d-newsub").value = "";
  $("#d-subblock").style.display = t.agent && !kids.length ? "none" : "";
  renderAgent(t);
  $("#d-dates").textContent = `Created ${fmt(t.created)} · Updated ${fmt(t.updated)}`;
  disarmDelete();
}

$("#d-title").addEventListener("input", (e) => { const t = task(openId); t.title = e.target.value; touch(t); });
$("#d-title").addEventListener("blur", (e) => { const t = task(openId); if (t && t.id !== draftId && !t.title.trim()) { t.title = "Untitled"; e.target.value = t.title; touch(t); } });
$("#d-notes").addEventListener("input", (e) => { const t = task(openId); t.notes = e.target.value; touch(t); });
$("#d-tags").addEventListener("input", (e) => { const t = task(openId); t.tags = parseTags(e.target.value); touch(t); });
$("#d-prio").addEventListener("change", (e) => { const t = task(openId); t.priority = e.target.value; touch(t); });
$("#d-col").addEventListener("change", (e) => { moveTask(openId, e.target.value, null); renderDetail(); });
$("#d-newsub").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const parent = task(openId);
  addTask(e.target.value, isDone(parent) ? firstOpenCol() : parent.column, parent.id);
  renderDetail(); $("#d-newsub").focus();
});
$("#d-close").onclick = closeDetail;
$("#overlay").addEventListener("mousedown", (e) => { if (e.target.id === "overlay") closeDetail(); });

// Two-step delete instead of window.confirm (a modal dialog blocks browser automation).
let deleteArmed = false;
function disarmDelete() { deleteArmed = false; const b = $("#d-delete"); b.classList.remove("armed"); b.textContent = "Delete"; }
$("#d-delete").onclick = () => {
  const t = task(openId);
  if (!deleteArmed) {
    const n = descendants(t.id).length;
    deleteArmed = true;
    $("#d-delete").classList.add("armed");
    $("#d-delete").textContent = n ? `Delete with ${n} subtask${n > 1 ? "s" : ""}?` : "Really delete?";
    return;
  }
  const parent = t.parent;
  deleteTask(t.id);
  if (parent && task(parent)) { openId = parent; renderDetail(); } else closeDetail();
};

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && openId) closeDetail();
  else if (e.key === "/" && !openId && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); $("#search").focus(); }
});

// ---------------------------------------------------------------- Send to Claude
// server.py starts `claude --bg` for a task and watches it. tasks.json keeps only { id, started } on the
// task; the live phase (working / needs_you / finished / gone), reason and message log come from /api/agents.
let agents = {};                 // task id -> { id, sessionId, state, phase, reason, log }
const PHASES = { working: "working", needs_you: "needs you", finished: "finished", gone: "removed" };
const phaseLabel = (a) => (a ? PHASES[a.phase] || a.phase : "…");
// Prompt cache of the session's last API call (server reads it from the transcript). Past `expires`, a reply
// re-reads the whole context at full price instead of the cached rate. Hidden while working (kept warm) or gone.
function cacheChip(ag, long) {
  const c = ag && ag.cache;
  if (!c || ag.phase === "working" || ag.phase === "gone") return "";
  return `<span class="ttl" data-exp="${c.expires}" data-tok="${c.tokens}" data-ttl="${c.ttl}" data-long="${long ? 1 : ""}"></span>`;
}
function tickCache() {
  const nowS = Date.now() / 1000;
  const dur = (s) => { const m = Math.max(1, Math.round(s / 60)), h = Math.floor(m / 60); return h ? h + "h" + (m % 60 ? " " + (m % 60) + "m" : "") : m + "m"; };
  for (const el of document.querySelectorAll(".ttl")) {
    const left = +el.dataset.exp - nowS, tok = Math.round(+el.dataset.tok / 1000) + "k tokens", tier = el.dataset.ttl >= 3600 ? "1h" : "5m";
    el.className = "ttl" + (left <= 0 ? " cold" : left < 300 ? " low" : "");
    el.title = left > 0 ? `Prompt cache (${tier} TTL) expires in ${dur(left)}. A reply before then reads ${tok} from cache.`
      : `Prompt cache expired ${dur(-left)} ago. A reply re-reads ${tok} at full cost.`;
    el.textContent = el.dataset.long
      ? (left > 0 ? `cache warm · ${dur(left)} left · ${tok}` : `cache expired ${dur(-left)} ago · reply re-reads ${tok} at full cost`)
      : (left > 0 ? `cache ${dur(left)}` : "cache cold");
  }
}
setInterval(tickCache, 15000);
const colNamed = (re) => state.columns.find((c) => !c.done && re.test(c.name));

function renderAgent(t) {
  queueMicrotask(tickCache);   // fill the cache chips this render creates
  const ag = t.agent && agents[t.id];
  // Send is one-shot: it sits in the left pane until the task has a session, then the right pane takes over.
  const send = $("#d-send");
  send.textContent = "Send to Claude";
  send.style.display = t.agent ? "none" : "";
  send.disabled = !useServer;
  send.title = useServer ? "Start a background Claude session on this task" : "Needs server.py";
  send.onclick = () => sendToClaude(t);
  $("#d-right").style.display = t.agent ? "" : "none";
  $("#d-agent").innerHTML = t.agent ? `<span class="agent ${ag ? ag.phase : ""}">${esc(phaseLabel(ag))}</span><span>started ${fmt(t.agent.started)}</span>${cacheChip(ag, true)}
      <code title="Click to copy">claude attach ${esc((ag && ag.id) || t.agent.id)}</code>` : "";
  const code = $("#d-agent code");
  if (code) code.onclick = () => { navigator.clipboard.writeText(code.textContent); setStatus("Copied " + code.textContent); };

  const log = (ag && ag.log) || [];
  $("#d-log").innerHTML = log.slice(-30).map((e) => `<li class="k-${e.from === "you" ? "you" : esc(e.status)}"><span class="who">${e.from === "you" ? "You" : "Claude"} · ${esc(e.status)} · ${fmt(e.at)}</span><div class="msg">${esc(e.message)}</div>${e.images && e.images.length ? `<div class="thumbs">${thumbItems(e.images, fileDir("agent_reports/images"))}</div>` : ""}</li>`).join("");
  $("#d-log").scrollTop = $("#d-log").scrollHeight;
  // A blocked session with no question in the log is sitting on a prompt only `claude attach` can show.
  if (ag && ag.phase === "needs_you" && !log.some((e) => e.status === "question"))
    $("#d-log").insertAdjacentHTML("beforeend", `<li class="k-question"><span class="who">Board</span><div class="msg">${esc(ag.reason)}</div></li>`);
  $("#d-reply-wrap").style.display = replyOpen(t) ? "flex" : "none";
  renderReplyImages();
}
const replyOpen = (t) => { const ag = t.agent && agents[t.id]; return !!(ag && ag.sessionId && ag.phase !== "working" && ag.phase !== "gone"); };

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const res = await r.json();
  if (!r.ok) throw new Error(res.error || r.status);
  return res;
}

async function sendToClaude(t) {
  $("#d-send").disabled = true;
  setStatus("Starting Claude…");
  // The card moves on the click itself; a failed launch puts it back.
  const fromCol = t.column, prog = colNamed(/progress|doing/i);
  if (prog && t.column !== prog.id) moveTask(t.id, prog.id, null);
  render(); $("#d-col").value = t.column;
  if (saveTimer) { clearTimeout(saveTimer); await flush(); }   // server builds the prompt from tasks.json
  try {
    const res = await post("/api/agent", { p: P, taskId: t.id });
    t.agent = { id: res.id, started: now() };
    touch(t);
    if (saveTimer) { clearTimeout(saveTimer); await flush(); }   // the watcher reads t.agent from tasks.json
    setStatus("Claude session " + res.id + " started");
  } catch (e) {
    if (t.column !== fromCol) moveTask(t.id, fromCol, null);
    if (saveTimer) { clearTimeout(saveTimer); await flush(); }   // else its "Saved" would replace the error
    setStatus("Send to Claude failed: " + e.message, true);
  }
  render();
  if (openId === t.id) { renderAgent(t); $("#d-col").value = t.column; }
  await pollAgents();
}

async function sendReply() {
  const t = task(openId), text = $("#d-reply").value.trim();
  if (!t || (!text && !replyImages.length)) return;
  $("#d-reply-send").disabled = true;
  setStatus("Sending reply…");
  try {
    await post("/api/agent/reply", { p: P, taskId: t.id, text, images: replyImages });
    $("#d-reply").value = ""; replyImages = []; renderReplyImages();
    setStatus("Reply sent — Claude is back at work");
  } catch (e) {
    setStatus("Reply failed: " + e.message, true);
  }
  $("#d-reply-send").disabled = false;
  await pollAgents();
}
$("#d-reply-send").onclick = sendReply;
$("#d-reply").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendReply(); } });

let pollTimer = null, polledOnce = false;
async function pollAgents() {
  clearTimeout(pollTimer);
  if (!useServer || !P) return;
  const pid = P;
  try {
    const r = await fetch(api("/api/agents"), { cache: "no-store" });
    const next = await r.json();
    if (!r.ok) throw new Error(next.error || r.status);
    if (pid !== P) return;   // switched projects while this was in flight
    // Column moves happen on phase CHANGES only, so a card you moved by hand stays put.
    for (const [id, a] of Object.entries(next)) {
      const t = task(id), was = agents[id] && agents[id].phase;
      if (!t || !polledOnce || was === a.phase) continue;
      const review = colNamed(/review/i), prog = colNamed(/progress|doing/i);
      if (a.phase === "finished" && review && !isDone(t) && t.column !== review.id) moveTask(t.id, review.id, null);
      if (a.phase === "working" && prog && review && t.column === review.id) moveTask(t.id, prog.id, null);
    }
    const changed = JSON.stringify(next) !== JSON.stringify(agents);
    agents = next;
    if (!polledOnce && !seenPrimed) markSeen(Object.keys(next));
    if (openId) markSeen([openId]);   // news that lands while you have the card open is read
    polledOnce = true;
    updateWaiting();
    // Refresh only the Claude block and column so a poll never resets text being typed in the panel.
    if (changed) { render(); const o = openId && task(openId); if (o) { renderAgent(o); $("#d-col").value = o.column; } }
  } catch (e) {
    setStatus("Claude status check failed: " + e.message, true);
  }
  pollTimer = setTimeout(pollAgents, 4000);
}

function updateWaiting() {
  const waiting = state.tasks.filter((t) => t.agent && agents[t.id] && agents[t.id].phase === "needs_you");
  const name = project() ? project().name + " · Task Board" : "Task Board";
  document.title = waiting.length ? `(${waiting.length}) Claude needs you · ${name}` : name;
  const b = $("#waiting");
  b.style.display = waiting.length ? "inline-block" : "none";
  b.textContent = `${waiting.length} waiting on you`;
  b.onclick = () => waiting.length && openDetail(waiting[0].id);
}

// ---------------------------------------------------------------- images
// Pasted/dropped images upload to server.py, which stores them by content hash and returns the file name.
// Task images live in <board>/images/ (names on t.images); reply and report images in <board>/agent_reports/images/.
const fileDir = (sub) => (useServer ? `/files/${P}/${sub}/` : sub + "/");
let replyImages = [];            // uploaded, waiting for Send reply

function thumbItems(names, dir, removable) {
  return (names || []).map((n, i) => `<a class="thumb" href="${dir + esc(n)}" target="_blank" title="Open full size"><img src="${dir + esc(n)}" alt="">${removable ? `<button class="x" data-i="${i}" title="Remove">✕</button>` : ""}</a>`).join("");
}
function bindRemove(box, list, after) {
  box.querySelectorAll(".x").forEach((b) => (b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); list.splice(+b.dataset.i, 1); after(); }));
}
function renderImages(t) {
  const box = $("#d-images");
  box.innerHTML = thumbItems(t.images, fileDir("images"), !t.agent);
  bindRemove(box, t.images || [], () => { touch(t); renderImages(t); render(); });
  $("#d-img-hint").textContent = t.agent ? "Sent to Claude — the task is locked. Add anything new as a reply."
    : useServer ? "Paste (⌘V) or drop an image to attach it — Claude gets it with the task." : "Attaching images needs server.py.";
}
function renderReplyImages() {
  const box = $("#d-reply-images");
  box.innerHTML = thumbItems(replyImages, fileDir("agent_reports/images"), true);
  bindRemove(box, replyImages, renderReplyImages);
}

async function uploadImage(file, kind) {
  const data = await new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = () => fail(r.error);
    r.readAsDataURL(file);
  });
  return (await post("/api/image", { p: P, kind, data })).name;
}

// Into the reply when it is focused (or the only place it can go), else onto the task.
async function attachFiles(files, toReply) {
  const t = task(openId);
  files = files.filter((f) => f.type.startsWith("image/"));
  if (!t || !files.length) return false;
  if (!toReply && t.agent) {   // a sent task is locked; images go to the reply instead
    if (!replyOpen(t)) { setStatus("This task was sent to Claude — attach images to a reply", true); return true; }
    toReply = true;
  }
  if (!useServer) { setStatus("Attaching images needs server.py", true); return true; }
  setStatus(`Uploading ${files.length} image${files.length > 1 ? "s" : ""}…`);
  try {
    for (const f of files) {
      const name = await uploadImage(f, toReply ? "log" : "task");
      if (toReply) { if (!replyImages.includes(name)) replyImages.push(name); }
      else { t.images = t.images || []; if (!t.images.includes(name)) t.images.push(name); touch(t); }
    }
    toReply ? renderReplyImages() : (renderImages(t), render());
    setStatus(toReply ? "Image added to your reply" : "Image attached to the task");
  } catch (e) {
    setStatus("Image upload failed: " + e.message, true);
  }
  return true;
}

$("#overlay").addEventListener("paste", (e) => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])];
  if (!files.some((f) => f.type.startsWith("image/"))) return;   // plain text pastes as usual
  e.preventDefault();
  attachFiles(files, document.activeElement === $("#d-reply"));
});
$("#panel").addEventListener("dragover", (e) => {
  if (drag || !e.dataTransfer.types.includes("Files")) return;
  e.preventDefault(); $("#panel").classList.add("drop-target");
});
$("#panel").addEventListener("dragleave", (e) => { if (!$("#panel").contains(e.relatedTarget)) $("#panel").classList.remove("drop-target"); });
$("#panel").addEventListener("drop", (e) => {
  if (drag || !e.dataTransfer.files.length) return;
  e.preventDefault(); $("#panel").classList.remove("drop-target");
  const t = task(openId);
  attachFiles([...e.dataTransfer.files], t && replyOpen(t) && $("#d-reply-wrap").contains(e.target));
});

// ---------------------------------------------------------------- misc
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(iso) { return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—"; }

// Text size is a per-browser view preference, like collapsed groups.
function applyTextSize(v) { document.documentElement.style.setProperty("--ts", v); $("#text-size").value = v; }
try { const v = localStorage.getItem(LS_KEY + ":ts"); if (v) applyTextSize(v); } catch (_) {}
$("#text-size").addEventListener("change", (e) => {
  applyTextSize(e.target.value);
  try { localStorage.setItem(LS_KEY + ":ts", e.target.value); } catch (_) {}
});
$("#search").addEventListener("input", render);
$("#show-subs").addEventListener("change", () => {
  try { localStorage.setItem(LS_KEY + ":subs", $("#show-subs").checked ? "1" : "0"); } catch (_) {}
  render();
});
try { if (localStorage.getItem(LS_KEY + ":subs") === "0") $("#show-subs").checked = false; } catch (_) {}

load().then(() => { render(); if (!useServer) setStatus("Saving in this browser"); pollAgents(); })
  .catch((e) => setStatus("Could not load the board: " + e.message, true));
</script>
</body>
</html>
